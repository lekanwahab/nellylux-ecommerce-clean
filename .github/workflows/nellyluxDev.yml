name: Build Dev

on:
  push:
    branches:
      - dev

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push (dev)
        run: |
          docker build -t olamilekan22/nellyhair_backend:dev ./backend
          docker push olamilekan22/nellyhair_backend:dev

          docker build -t olamilekan22/nellylux_frontend:dev ./frontend
          docker push olamilekan22/nellylux_frontend:dev
