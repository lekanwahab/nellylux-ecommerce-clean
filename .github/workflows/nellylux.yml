name: Build Prod

on:
  push:
    branches:
      - main

jobs:
  main:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push (prod)
        run: |
          docker build -t olamilekan22/nellyhair_backend:latest ./backend
          docker push olamilekan22/nellyhair_backend:latest

          docker build -t olamilekan22/nellylux_frontend:latest ./frontend
          docker push olamilekan22/nellylux_frontend:latest
