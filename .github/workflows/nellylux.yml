name: Build, Push (Main & Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # ✅ Only require approval for main (production)
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || null }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          if [ "${GITHUB_REF##*/}" = "dev" ]; then
            echo "TAG=dev" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -t olamilekan22/nellyhair_backend:${{ steps.vars.outputs.TAG }} ./backend
          docker push olamilekan22/nellyhair_backend:${{ steps.vars.outputs.TAG }}

      - name: Build & Push Frontend
        run: |
          docker build -t olamilekan22/nellylux_frontend:${{ steps.vars.outputs.TAG }} ./frontend
          docker push olamilekan22/nellylux_frontend:${{ steps.vars.outputs.TAG }}
