apiVersion: apps/v1
kind: Deployment
metadata:
  name: nelly-lux-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nelly-lux-front
  template:
    metadata:
      labels:
        app: nelly-lux-front
    spec:
      nodeSelector:
        app: nelly  
      containers:
        - name: nelly-lux-front
          image: olamilekan22/nellylux_frontend:latest
          ports:
            - containerPort: 8000
